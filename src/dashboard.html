<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060d">
<title>IG Agent</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  @font-face { font-family: "Rubik"; src: url(assets/rubik-hebrew.woff2) format("woff2"); font-weight: 300 900; font-display: swap; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Rubik"; src: url(assets/rubik-latin.woff2) format("woff2"); font-weight: 300 900; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  :root {
    --bg: #05060d; --text: #eef1ff; --muted: #a2abd0; --dim: #636c96;
    --cyan: #22d3ee; --indigo: #818cf8; --pink: #e879f9; --rose: #fb7185;
    --ok: #34f5c5; --warn: #ffd166; --alert: #ff5c8a;
    --holo: linear-gradient(110deg, var(--cyan), var(--indigo) 42%, var(--pink) 74%, var(--rose));
    --glass: linear-gradient(180deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .022));
    --edge: rgba(255, 255, 255, .10);
    --r: 22px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 15px/1.55 "Rubik", system-ui, -apple-system, "Segoe UI", "Heebo", Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }

  /* ---- atmosphere ---- */
  .sky { position: fixed; inset: -6%; z-index: -3; background: url(assets/bg.webp) center / cover no-repeat; animation: drift 46s ease-in-out infinite alternate; }
  .veil { position: fixed; inset: 0; z-index: -2; background: radial-gradient(1200px 700px at 50% 40%, rgba(5, 6, 13, .10), rgba(5, 6, 13, .55) 80%), linear-gradient(180deg, rgba(5, 6, 13, 0), rgba(5, 6, 13, .55)); }
  .grid-bg { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 72%); }
  @keyframes drift { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.08) translate3d(-1.5%, 1.2%, 0); } }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- glass ---- */
  .glass { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 24px 60px rgba(0, 0, 0, .45); }
  .panel { padding: 22px 22px 8px; }
  .stack { display: grid; gap: 16px; align-content: start; }
  .cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; align-items: start; }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  h2::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  h2 .count { letter-spacing: 0; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); border: 1px solid var(--edge); color: var(--text); }
  h2 .side { margin-inline-start: auto; letter-spacing: 0; font-weight: 400; display: flex; gap: 14px; color: var(--dim); }
  .empty { color: var(--dim); padding: 16px 0 22px; font-size: 14px; }

  /* ---- hero ---- */
  .hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding: 30px 34px; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--holo); background-size: 220% 100%; animation: sheen 9s linear infinite; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .75; pointer-events: none; }
  @keyframes sheen { to { background-position: -220% 0; } }
  .kicker { font-size: 11px; letter-spacing: .32em; color: var(--cyan); font-weight: 500; direction: ltr; unicode-bidi: isolate; text-align: right; }
  .name { font-size: clamp(30px, 5vw, 52px); font-weight: 700; line-height: 1.08; letter-spacing: -.02em; direction: ltr; unicode-bidi: isolate; text-align: right; background: linear-gradient(100deg, #fff 20%, #b9e9ff 55%, #f0b4ff); -webkit-background-clip: text; background-clip: text; color: transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-bottom: 4px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ok)); box-shadow: 0 0 0 0 var(--c, var(--ok)); animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--ok)) 70%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
  .core { position: relative; width: 190px; height: 190px; flex: none; }
  .core img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 71%); mask-image: radial-gradient(circle, #000 52%, transparent 71%); animation: float 7s ease-in-out infinite; }
  .core svg { position: absolute; inset: 0; transform: rotate(-90deg); filter: drop-shadow(0 0 8px rgba(34, 211, 238, .7)); }
  .core .dash { position: absolute; inset: -9px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .16); animation: spin 60s linear infinite; }
  @keyframes float { 50% { transform: translateY(-7px) scale(1.02); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core .lvl { position: absolute; inset: auto 0 -6px 0; text-align: center; font-size: 11px; letter-spacing: .24em; color: var(--muted); }
  .core .lvl b { display: inline-block; font-size: 15px; letter-spacing: 0; color: var(--text); background: rgba(5, 6, 13, .75); border: 1px solid var(--edge); border-radius: 99px; padding: 2px 12px; margin-inline-start: 6px; }
  .xp { margin-top: 18px; max-width: 420px; }
  .xp .bar { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .09); overflow: hidden; }
  .xp .bar i { display: block; height: 100%; border-radius: 99px; background: var(--holo); box-shadow: 0 0 14px rgba(232, 121, 249, .8); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .xp .cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 7px; }

  /* ---- tabs ---- */
  .tabs { display: inline-flex; gap: 4px; padding: 5px; margin: 18px 0 16px; border-radius: 99px; }
  .tab { background: none; border: 0; padding: 9px 20px; border-radius: 99px; cursor: pointer; color: var(--muted); font-weight: 500; display: inline-flex; gap: 8px; align-items: center; transition: color .2s ease; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.on { color: #060714; font-weight: 600; background: var(--holo); box-shadow: 0 0 26px rgba(129, 140, 248, .55); }
  .tab .badge { font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 99px; background: var(--alert); color: #fff; }
  .tab.on .badge { background: rgba(6, 7, 20, .82); color: #fff; }

  /* ---- quests ---- */
  .quests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .quest { display: flex; gap: 13px; align-items: center; padding: 14px 18px; border-radius: 18px; }
  .quest .ring { width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, .28); display: grid; place-items: center; flex: none; font-size: 13px; color: #060714; }
  .quest b { display: block; font-weight: 600; }
  .quest small { color: var(--dim); font-size: 13px; }
  .quest.done { border-color: rgba(52, 245, 197, .45); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 0 34px rgba(52, 245, 197, .16); }
  .quest.done .ring { border: 0; background: var(--ok); box-shadow: 0 0 18px var(--ok); font-weight: 800; }

  /* ---- metric tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  .tile { padding: 18px 18px 16px; border-radius: 18px; overflow: hidden; transition: transform .25s ease, border-color .25s ease; }
  .tile::after { content: ""; position: absolute; inset: 0 22% auto 22%; height: 1px; background: var(--holo); opacity: 0; transition: opacity .25s ease, inset .25s ease; }
  .tile:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, .2); }
  .tile:hover::after { opacity: 1; inset: 0 6% auto 6%; }
  .tile .value { font-size: 40px; font-weight: 300; line-height: 1; letter-spacing: -.03em; text-align: right; background: linear-gradient(180deg, #fff, #a9dcff); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 3px; }
  .tile .label { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .tile .delta { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .tile .meter { height: 3px; border-radius: 99px; background: rgba(255, 255, 255, .08); margin-top: 12px; overflow: hidden; }
  .tile .meter i { display: block; height: 100%; background: var(--holo); border-radius: 99px; }
  .up { color: var(--ok); } .down { color: var(--alert); }

  /* ---- lists ---- */
  .item { padding: 14px 0; border-top: 1px solid rgba(255, 255, 255, .07); }
  .item:first-of-type { border-top: 0; }
  .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .left { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
  .handle { font-weight: 600; direction: ltr; unicode-bidi: isolate; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote { color: var(--muted); font-size: 14px; margin-top: 5px; overflow-wrap: anywhere; }
  .draft { margin-top: 10px; padding: 11px 14px; border-radius: 14px; background: rgba(8, 10, 24, .55); border: 1px solid rgba(255, 255, 255, .08); border-inline-start: 2px solid var(--pink); box-shadow: -14px 0 30px -18px var(--pink); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); color: var(--muted); white-space: nowrap; }
  .kind { font-size: 11px; letter-spacing: .08em; color: var(--dim); white-space: nowrap; }
  .meta { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .timer { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: rgba(34, 211, 238, .1); border: 1px solid rgba(34, 211, 238, .3); color: var(--cyan); white-space: nowrap; }
  .timer.low { background: rgba(255, 92, 138, .12); border-color: rgba(255, 92, 138, .4); color: var(--alert); }
  .wait { width: 8px; height: 8px; border-radius: 50%; flex: none; --c: var(--alert); background: var(--alert); animation: pulse 1.8s ease-out infinite; }
  .stage { font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; color: var(--c); }
  .stage i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5), inset 0 -8px 14px rgba(0, 0, 0, .28), 0 0 18px -4px var(--glow); }
  .ava.big { width: 54px; height: 54px; font-size: 22px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: start; font-size: 11px; letter-spacing: .1em; color: var(--dim); font-weight: 500; padding: 4px 0 10px; }
  td { padding: 13px 0; border-top: 1px solid rgba(255, 255, 255, .07); vertical-align: top; }
  td.n, th.n { text-align: left; }
  .kv { display: grid; grid-template-columns: 1fr auto; margin: 0; font-size: 14px; }
  .kv dt, .kv dd { padding: 11px 0; border-top: 1px solid rgba(255, 255, 255, .07); margin: 0; }
  .kv dt:first-of-type, .kv dd:first-of-type { border-top: 0; }
  .kv dt { color: var(--muted); } .kv dd { text-align: left; font-weight: 500; }

  /* ---- chart ---- */
  .chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 10px; align-items: end; height: 150px; direction: ltr; padding-bottom: 14px; }
  .chart .day { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 8px; min-width: 0; }
  .chart .bars { display: flex; gap: 3px; align-items: flex-end; height: 100%; }
  .chart .bars i { flex: 1; min-height: 2px; border-radius: 6px 6px 2px 2px; }
  .chart .in { background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .12)); }
  .chart .out { background: linear-gradient(180deg, var(--cyan), var(--indigo) 60%, var(--pink)); box-shadow: 0 0 16px -2px rgba(129, 140, 248, .9); }
  .chart .d { font-size: 10px; color: var(--dim); text-align: center; }
  .chart .day.today .d { color: var(--cyan); font-weight: 600; }
  .key i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-inline-end: 6px; }

  /* ---- CRM ---- */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1; min-width: 200px; background: rgba(255, 255, 255, .05); border: 1px solid var(--edge); border-radius: 99px; padding: 11px 20px; color: var(--text); font: inherit; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); transition: border-color .2s ease, box-shadow .2s ease; }
  .search:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(34, 211, 238, .14), 0 0 30px rgba(34, 211, 238, .2); }
  .search::placeholder { color: var(--dim); }
  .toggle { background: rgba(255, 255, 255, .05); border: 1px solid var(--edge); border-radius: 99px; padding: 10px 18px; cursor: pointer; color: var(--muted); font-size: 14px; white-space: nowrap; transition: all .2s ease; }
  .toggle.on { color: #060714; background: var(--holo); border-color: transparent; font-weight: 600; box-shadow: 0 0 22px rgba(129, 140, 248, .5); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .board.with-spam { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .col { padding: 14px 12px 6px; border-radius: 20px; }
  .col-head { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; letter-spacing: .06em; padding: 2px 6px 12px; }
  .col-head i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .col-head .count { margin-inline-start: auto; color: var(--dim); font-weight: 500; letter-spacing: 0; }
  .col-head::after { content: ""; position: absolute; inset: 0 30% auto 30%; height: 1px; background: var(--c); box-shadow: 0 0 14px var(--c); opacity: .8; }
  .lead { display: block; width: 100%; text-align: start; background: rgba(8, 10, 24, .5); border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; padding: 12px 13px; margin-bottom: 9px; cursor: pointer; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .lead:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .24); box-shadow: 0 14px 34px rgba(0, 0, 0, .45), 0 0 26px -8px var(--indigo); }
  .lead.waiting { border-color: rgba(255, 92, 138, .38); box-shadow: 0 0 26px -10px var(--alert); }
  .lead .snippet { color: var(--muted); font-size: 13px; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .lead .foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .lead .foot .meta { margin-inline-start: auto; }
  .more { color: var(--dim); font-size: 12px; padding: 4px 6px 10px; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 18px; text-align: center; }
  .art-empty { display: flex; align-items: center; gap: 6px; padding: 0 0 12px; color: var(--muted); font-size: 14px; }
  .art-empty img { width: 190px; height: auto; flex: none; -webkit-mask-image: radial-gradient(ellipse, #000 45%, transparent 72%); mask-image: radial-gradient(ellipse, #000 45%, transparent 72%); animation: float 6s ease-in-out infinite; }

  /* ---- drawer ---- */
  .backdrop { position: fixed; inset: 0; background: rgba(3, 4, 10, .6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; inset: 12px auto 12px 12px; width: min(460px, calc(100vw - 24px)); z-index: 21; transform: translateX(-112%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; border-radius: 26px; background: linear-gradient(180deg, rgba(22, 24, 48, .86), rgba(9, 10, 24, .9)); border: 1px solid rgba(255, 255, 255, .13); -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%); box-shadow: 0 40px 120px rgba(0, 0, 0, .7), 0 0 60px -20px var(--indigo); overflow: hidden; }
  .drawer.open { transform: none; }
  .d-head { padding: 22px 22px 16px; display: flex; gap: 14px; align-items: center; }
  .d-head .x { margin-inline-start: auto; background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); color: var(--muted); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; flex: none; }
  .d-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 22px 16px; }
  .d-fact { padding: 10px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); text-align: center; }
  .d-fact b { display: block; font-size: 20px; font-weight: 400; } .d-fact span { font-size: 11px; color: var(--dim); }
  .d-notes { margin: 0 22px 14px; padding: 11px 14px; border-radius: 14px; background: rgba(255, 209, 102, .07); border: 1px solid rgba(255, 209, 102, .26); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .d-notes b { display: block; font-size: 11px; letter-spacing: .1em; color: var(--warn); font-weight: 500; margin-bottom: 2px; }
  .chat { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 7px; border-top: 1px solid rgba(255, 255, 255, .07); }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 18px; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble.them { align-self: flex-start; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .08); border-start-start-radius: 6px; }
  .bubble.me { align-self: flex-end; background: linear-gradient(120deg, #2563eb, #7c3aed 60%, #c026d3); border-end-end-radius: 6px; box-shadow: 0 8px 26px -10px #7c3aed; }
  .bubble.pending { align-self: flex-end; border: 1px dashed var(--pink); color: var(--muted); }
  .bubble small { display: block; font-size: 10px; opacity: .7; margin-top: 3px; direction: ltr; text-align: end; }
  .daysep { align-self: center; font-size: 11px; color: var(--dim); margin: 10px 0 4px; }
  .d-foot { padding: 13px 22px; border-top: 1px solid rgba(255, 255, 255, .07); font-size: 12px; color: var(--dim); }


  /* ---- assistant ---- */
  .nova-fab { position: fixed; inset: auto auto 22px 22px; z-index: 30; width: 68px; height: 68px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .18); background: radial-gradient(circle at 50% 50%, rgba(129, 140, 248, .35), rgba(5, 6, 13, .9) 70%); cursor: pointer; padding: 0; box-shadow: 0 0 0 0 rgba(129, 140, 248, .6), 0 18px 50px rgba(0, 0, 0, .6); animation: beacon 3.2s ease-out infinite; transition: transform .25s ease; }
  .nova-fab:hover { transform: scale(1.08); }
  .nova-fab img, .nova-ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; transform: scale(1.28); -webkit-mask-image: radial-gradient(circle, #000 48%, transparent 66%); mask-image: radial-gradient(circle, #000 48%, transparent 66%); }
  .nova-fab .tip { position: absolute; inset: auto auto 50% 78px; transform: translateY(50%); white-space: nowrap; font-size: 13px; padding: 6px 14px; border-radius: 99px; background: rgba(10, 12, 28, .85); border: 1px solid var(--edge); color: var(--text); pointer-events: none; }
  .nova-fab.open .tip { display: none; }
  @keyframes beacon { 0% { box-shadow: 0 0 0 0 rgba(129, 140, 248, .55), 0 18px 50px rgba(0, 0, 0, .6); } 100% { box-shadow: 0 0 0 22px rgba(129, 140, 248, 0), 0 18px 50px rgba(0, 0, 0, .6); } }

<div class="sky"></div><div class="veil"></div><div class="grid-bg"></div>
<div class="wrap">
  <div id="banner" class="banner"></div>
  <div id="app"><div class="empty">טוען…</div></div>
  <footer id="foot"></footer>
</div>
<div id="backdrop" class="backdrop"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="פרטי ליד"></aside>
<section id="nova" class="nova" role="dialog" aria-label="{{ASSISTANT}}, העוזרת האישית"></section>
<button id="nova-fab" class="nova-fab" type="button" aria-label="פתח את {{ASSISTANT}}, העוזרת האישית"><img src="assets/orb.webp" alt=""><span class="tip">דבר עם {{ASSISTANT}}</span></button>
<script>
(() => {
  // Everything is rendered with textContent, so message text can never inject HTML.
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {

  const n = (v) => (v == null ? '—' : Number(v).toLocaleString('en-US'));
  const dur = (ms) => {
    if (ms == null) return null;
    const hrs = Math.floor(ms / 3600000), min = Math.floor((ms % 3600000) / 60000);
    return hrs ? `${hrs} שע׳` : `${min} דק׳`;
  };
  const timer = (ms) => h('span', { class: 'timer' + (ms < 3 * 3600000 ? ' low' : '') }, 'נותרו ' + dur(ms));
  const TYPE = { image: 'פוסט', story: 'סטורי', reel: 'ריל', carousel: 'קרוסלה' };
  const CAMPAIGN = { active: ['פעיל', 'var(--ok)'], paused: ['מושהה', 'var(--warn)'], draft: ['ממתין לאישור', 'var(--dim)'] };
  const STAGES = [['new', 'חדש', '#7dd3fc'], ['interested', 'מתעניין', '#ffd166'], ['customer', 'לקוח', '#34f5c5'], ['vip', 'VIP', '#e879f9'], ['spam', 'ספאם', '#636c96']];
  const stageOf = (k) => STAGES.find(([key]) => key === k) || STAGES[0];
  const stageTag = (k) => { const s = stageOf(k); return h('span', { class: 'stage', style: `--c:${s[2]}` }, h('i'), s[1]); };
  const state = { tab: location.hash.slice(1) || 'overview', q: '', waiting: false, spam: false, open: null, data: null };

  // Avatar: a small glass orb, colour derived from the username (cool hues only).
  const hue = (str) => { let x = 0; for (const ch of String(str)) x = (x * 31 + ch.codePointAt(0)) % 150; return 175 + x; };
  const ava = (who, big) => { const a = hue(who); return h('div', { class: 'ava' + (big ? ' big' : ''), style: `background:radial-gradient(circle at 30% 25%,hsl(${a} 95% 72%),hsl(${a + 40} 80% 46%) 60%,hsl(${a + 70} 80% 28%));--glow:hsl(${a + 20} 90% 60%)` }, String(who).slice(0, 1).toUpperCase()); };

  // ---------- hero ----------
  function hero(d) {

    ring.append(defs, svg('circle', { cx: 95, cy: 95, r: R, fill: 'none', stroke: 'rgba(255,255,255,.09)', 'stroke-width': 2 }),

      h('div', { style: 'min-width:0' },
        h('div', { class: 'kicker' }, 'IG AGENT · LIVE'),
        h('div', { class: 'name' }, a.username ? '@' + a.username : 'IG Agent'),
        h('div', { class: 'chips' },
          h('span', { class: 'chip' }, h('i', { class: 'pulse', style: a.connected ? '' : '--c:var(--alert);background:var(--alert)' }), a.connected ? 'מחובר' : 'לא מחובר'),
          h('span', { class: 'chip' }, h('i', { class: 'pulse', style: a.paused ? '--c:var(--warn);background:var(--warn)' : '' }), a.paused ? 'מושהה' : 'פעיל'),
          a.followers != null && h('span', { class: 'chip' }, h('b', { class: 'num' }, n(a.followers)), 'עוקבים', a.followers_delta ? h('span', { class: 'num ' + (a.followers_delta > 0 ? 'up' : 'down') }, (a.followers_delta > 0 ? '+' : '') + a.followers_delta) : null),
          h('span', { class: 'chip' }, h('b', { class: 'num' }, g.streak), g.streak === 1 ? 'יום ברצף' : 'ימים ברצף'),
          (d.health.auto_send_dm || d.health.auto_send_comments) && h('span', { class: 'chip', style: 'color:var(--warn);border-color:rgba(255,209,102,.4)' }, 'שליחה אוטומטית דולקת')),
        h('div', { class: 'xp' }, h('div', { class: 'bar' }, h('i', { style: `width:${Math.round(pct * 100)}%` })),

      h('div', { class: 'core' }, h('div', { class: 'dash' }), ring, h('img', { src: 'assets/orb.webp', alt: '' }), h('div', { class: 'lvl' }, 'רמה', h('b', { class: 'num' }, String(g.level).padStart(2, '0')))));
  }

  function tabs(d) {
    const waiting = d.leads.filter((l) => l.waiting && l.stage !== 'spam').length;
    const defs = [['overview', 'סקירה', d.pending.length], ['leads', 'לידים', waiting], ['content', 'תוכן וקמפיינים', 0]];
    return h('div', { class: 'glass tabs', role: 'tablist' }, defs.map(([key, label, badge]) => {
      const b = h('button', { class: 'tab' + (state.tab === key ? ' on' : ''), role: 'tab', type: 'button', 'aria-selected': String(state.tab === key) }, label, badge ? h('span', { class: 'badge num' }, badge) : null);
      b.addEventListener('click', () => { state.tab = key; history.replaceState(null, '', '#' + key); render(state.data, true); });
      return b;
    }));
  }

  // ---------- overview ----------
  const quests = (d) => h('div', { class: 'quests' }, d.game.missions.map((m) =>
    h('div', { class: 'glass quest' + (m.done ? ' done' : '') }, h('span', { class: 'ring' }, m.done ? '✓' : ''), h('div', null, h('b', null, m.title), h('small', null, m.detail)))));

  function tile(label, value, prev) {
    let delta = null;
    if (prev != null && value != null) {
      const diff = value - prev;
      delta = h('div', { class: 'delta' }, diff ? h('span', { class: 'num ' + (diff > 0 ? 'up' : 'down') }, (diff > 0 ? '▲ ' : '▼ ') + n(Math.abs(diff))) : 'ללא שינוי', diff ? ' מאתמול' : '');

  }
  const tiles = (d) => h('div', { class: 'tiles' },
    tile('הודעות נכנסו', d.today.messages_in, d.yesterday.messages_in),
    tile('תשובות יצאו', d.today.replies_sent, d.yesterday.replies_sent),
    tile('תגובות חדשות', d.today.comments_in, d.yesterday.comments_in),
    tile('פורסמו', d.today.published, d.yesterday.published),
    tile('הודעות קמפיין', d.today.campaign_dms, d.yesterday.campaign_dms),
    tile('קליקים', d.today.campaign_clicks, d.yesterday.campaign_clicks));

  function pending(d) {
    const items = d.pending.map((p) => h('div', { class: 'item' },
      h('div', { class: 'row' },
        h('div', { class: 'left' }, ava(p.who), h('span', { class: 'handle' }, '@' + p.who), h('span', { class: 'kind' }, p.kind === 'dm' ? 'הודעה' : 'תגובה')),
        p.window_ms != null ? timer(p.window_ms) : h('span', { class: 'meta num' }, p.created.slice(5))),
      h('div', { class: 'quote' }, p.incoming || ''),
      h('div', { class: 'draft' }, p.draft)));
    return panel('מחכה לאישור שלך בטלגרם', d.pending.length, items.length ? items : artEmpty('הכל טופל. אין טיוטות שמחכות לך.'));
  }

  function chart(d) {
    const max = Math.max(1, ...d.series.map((s) => Math.max(s.messages_in, s.replies_sent)));
    const days = d.series.map((s, i) => h('div', { class: 'day' + (i === d.series.length - 1 ? ' today' : ''), title: `${s.day}: ${s.messages_in} נכנסו, ${s.replies_sent} יצאו` },
      h('div', { class: 'bars' }, h('i', { class: 'in', style: `height:${(s.messages_in / max) * 100}%` }), h('i', { class: 'out', style: `height:${(s.replies_sent / max) * 100}%` })),
      h('div', { class: 'd' }, s.day.slice(8))));
    return h('section', { class: 'glass panel' },
      h('h2', null, '14 ימים אחרונים', h('span', { class: 'side' }, h('span', { class: 'key' }, h('i', { style: 'background:rgba(255,255,255,.5)' }), 'נכנסו'), h('span', { class: 'key' }, h('i', { style: 'background:var(--holo)' }), 'יצאו'))),

  function threads(d) {

  }

  function health(d) {
    const x = d.health;
    return panel('מצב המערכת', null, h('dl', { class: 'kv' },
      h('dt', null, 'תוקף הטוקן'), h('dd', { class: x.token_days != null && x.token_days <= 5 ? 'down' : '' }, x.token_days == null ? '—' : h('span', null, h('span', { class: 'num' }, x.token_days), ' ימים')),
      h('dt', null, 'סנכרון אחרון'), h('dd', { class: 'num' }, (x.last_poll || '—').slice(5)),
      h('dt', null, 'Webhook אחרון'), h('dd', { class: 'num' }, (x.last_webhook || '—').slice(5)),
      h('dt', null, 'סך תשובות'), h('dd', { class: 'num' }, n(d.game.totals.replies)),
      h('dt', null, 'סך פרסומים'), h('dd', { class: 'num' }, n(d.game.totals.posts))));
  }

  // ---------- content ----------
  function campaigns(d) {
    if (!d.campaigns.length) return panel('קמפיינים', null, h('div', { class: 'empty' }, 'אין קמפיינים. יוצרים דרך Claude ומאשרים בטלגרם.'));
    const rows = d.campaigns.map((c) => {
      const [label, color] = CAMPAIGN[c.status] || [c.status, 'var(--dim)'];
      return h('tr', null,
        h('td', null, h('div', { style: 'font-weight:600' }, c.name), h('div', { class: 'meta', style: 'white-space:normal' }, c.keywords.join(' · '))),

  }

  function insights(d) {

  function scheduled(d) {

      d.unpublished_media ? h('div', { class: 'meta', style: 'padding:0 0 14px;white-space:normal' }, `${d.unpublished_media} קבצים הועלו ועדיין לא פורסמו`) : null);

  function posts(d) {
    if (!d.posts.length) return null;
    return panel('פוסטים אחרונים', null, d.posts.map((p) => h('div', { class: 'item' },
      h('div', { class: 'row' }, h('span', { style: 'overflow-wrap:anywhere' }, p.caption || '(ללא כיתוב)'), h('span', { class: 'tag num' }, n(p.comments) + ' תגובות')),
      h('div', { class: 'meta num', style: 'margin-top:4px' }, (p.at || '').slice(5)))));
  }

  // ---------- leads ----------
  function leadCard(l) {
    const el = h('button', { class: 'lead' + (l.waiting ? ' waiting' : ''), type: 'button' },
      h('div', { class: 'row' }, h('div', { class: 'left', style: 'flex-wrap:nowrap' }, ava(l.who), h('span', { class: 'handle' }, '@' + l.who)), l.waiting ? h('i', { class: 'wait', title: 'מחכה לתשובה' }) : null),
      h('div', { class: 'snippet' }, (l.from_me ? 'אתה: ' : '') + (l.last || '')),
      h('div', { class: 'foot' }, l.waiting && timer(l.window_ms), l.tags.slice(0, 2).map((t) => h('span', { class: 'tag' }, t)), l.notes && h('span', { class: 'tag', title: l.notes }, 'הערה'), h('span', { class: 'meta num' }, (l.at || '').slice(5, 10))));
    el.addEventListener('click', () => openLead(l.id));
    return el;
  }

  function board() {
    const d = state.data, q = state.q.trim().toLowerCase();
    const list = d.leads.filter((l) => (!state.waiting || l.waiting) && (!q || [l.who, l.name, l.last, l.notes, ...l.tags].some((x) => x && String(x).toLowerCase().includes(q))));
    const cols = STAGES.filter(([k]) => k !== 'spam' || state.spam).map(([key, label, color]) => {
      const items = list.filter((l) => l.stage === key).sort((a, b) => Number(b.waiting) - Number(a.waiting));
      return h('div', { class: 'glass col' },
        h('div', { class: 'col-head', style: `--c:${color}` }, h('i'), label, h('span', { class: 'count num' }, items.length)),
        items.slice(0, 40).map(leadCard), items.length > 40 && h('div', { class: 'more' }, `ועוד ${items.length - 40}`), !items.length && h('div', { class: 'more' }, '—'));
    });
    return h('div', { class: 'board' + (state.spam ? ' with-spam' : ''), id: 'board' }, cols);
  }

  function funnel(d) {
    const real = d.leads.filter((l) => l.stage !== 'spam');
    const by = (k) => real.filter((l) => l.stage === k).length;
    const total = real.length, engaged = by('interested') + by('customer') + by('vip'), customers = by('customer') + by('vip'), waiting = real.filter((l) => l.waiting).length;
    const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
    const step = (label, value, sub, share) => h('div', { class: 'glass tile' }, h('div', { class: 'value num' }, n(value)), h('div', { class: 'label' }, label), h('div', { class: 'delta' }, sub), h('div', { class: 'meter' }, h('i', { style: `width:${share}%` })));
    return h('div', { class: 'tiles four' },
      step('לידים', total, 'כל מי שכתב לך', total ? 100 : 0),
      step('מתעניינים ומעלה', engaged, pct(engaged, total) + '% מהלידים', pct(engaged, total)),
      step('לקוחות', customers, pct(customers, engaged) + '% מהמתעניינים', pct(customers, total)),
      step('מחכים לתשובה', waiting, 'בחלון 24 השעות', pct(waiting, total)));
  }

  function leadsView(d) {
    const search = h('input', { class: 'search', type: 'search', placeholder: 'חיפוש: שם, תגית, הערה או טקסט', 'aria-label': 'חיפוש לידים' });
    search.value = state.q;
    const refresh = () => document.getElementById('board')?.replaceWith(board());
    search.addEventListener('input', () => { state.q = search.value; refresh(); });
    const toggle = (label, key) => {
      const b = h('button', { class: 'toggle' + (state[key] ? ' on' : ''), type: 'button', 'aria-pressed': String(state[key]) }, label);
      b.addEventListener('click', () => { state[key] = !state[key]; b.classList.toggle('on', state[key]); b.setAttribute('aria-pressed', String(state[key])); refresh(); });
      return b;
    };
    return h('div', null, funnel(d), h('div', { class: 'toolbar' }, search, toggle('רק מחכים לתשובה', 'waiting'), toggle('הצג ספאם', 'spam')),
      d.leads.length ? board() : h('div', { class: 'glass panel' }, artEmpty('עוד אין שיחות. מי שיכתוב לך יופיע כאן.')),
      h('div', { class: 'hint' }, 'לשינוי שלב, תגיות או הערות מבקשים מ-Claude, למשל: "סמן את dana כלקוחה והוסף הערה".'));
  }

  // ---------- lead drawer ----------
  const drawer = document.getElementById('drawer'), backdrop = document.getElementById('backdrop');
  function closeLead() { state.open = null; drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  backdrop.addEventListener('click', closeLead);
  document.addEventListener('keydown', (e) => e.key === 'Escape' && closeLead());
  function closeBtn() { const b = h('button', { class: 'x', type: 'button', 'aria-label': 'סגור' }, '✕'); b.addEventListener('click', closeLead); return b; }

  async function openLead(id, silent) {
    state.open = id;
    const lead = state.data.leads.find((l) => l.id === id);
    if (!silent) {
      drawer.replaceChildren(h('div', { class: 'd-head' }, ava(lead?.who || '?', true), h('div', { class: 'handle', style: 'font-size:20px' }, '@' + (lead?.who || '')), closeBtn()), h('div', { class: 'empty', style: 'padding:0 22px' }, 'טוען שיחה…'));
      drawer.classList.add('open'); backdrop.classList.add('open');
    }
    let t;
    try {
      t = await (await fetch(`thread/${encodeURIComponent(id)}.json`, { cache: 'no-store' })).json();
    } catch { return; }
    if (state.open !== id || !t) return;
    const chat = h('div', { class: 'chat' });
    let day = '';
    for (const m of t.messages) {
      if (m.at.slice(0, 10) !== day) { day = m.at.slice(0, 10); chat.append(h('div', { class: 'daysep num' }, day)); }
      chat.append(h('div', { class: 'bubble ' + (m.me ? 'me' : 'them') }, m.text, h('small', null, m.at.slice(11) + (m.ai ? ' · AI' : ''))));
    }
    for (const dr of t.drafts) chat.append(h('div', { class: 'bubble pending' }, dr.text, h('small', null, `טיוטה #${dr.id} · מחכה לאישור`)));
    const keepScroll = silent ? drawer.querySelector('.chat')?.scrollTop : null;
    drawer.replaceChildren(
      h('div', { class: 'd-head' }, ava(t.who, true),
        h('div', { style: 'min-width:0' }, h('div', { class: 'handle', style: 'font-size:20px' }, '@' + t.who),
          h('div', { class: 'left', style: 'margin-top:5px' }, stageTag(t.stage), t.tags.map((x) => h('span', { class: 'tag' }, x)))), closeBtn()),
      h('div', { class: 'd-facts' },
        h('div', { class: 'd-fact' }, h('b', { class: 'num' }, n(lead?.msgs_in)), h('span', null, 'הודעות ממנו')),
        h('div', { class: 'd-fact' }, h('b', { class: 'num' }, n(lead?.msgs_out)), h('span', null, 'תשובות שלך')),
        h('div', { class: 'd-fact' }, h('b', null, t.window_ms > 0 ? dur(t.window_ms) : 'סגור'), h('span', null, 'חלון מענה'))),
      t.notes && h('div', { class: 'd-notes' }, h('b', null, 'ההערות שלך'), t.notes),
      chat,
      h('div', { class: 'd-foot' }, (lead?.first_at ? `בקשר מאז ${lead.first_at} · ` : '') + 'תצוגה בלבד. עונים דרך טלגרם או Claude.'));
    const box = drawer.querySelector('.chat');
    box.scrollTop = keepScroll ?? box.scrollHeight;
  }

  // ---------- the built-in assistant ----------
  const nova = document.getElementById('nova'), fab = document.getElementById('nova-fab');
  const KEY = 'nova-chat';
  let chat = [];
  try { chat = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch { chat = []; }
  let busy = false;
  const SUGGEST = ['מה מחכה לי עכשיו?', 'סכם לי את היום', 'מי הלידים הכי חמים?', 'איך הקמפיינים מתפקדים?'];

  const logEl = h('div', { class: 'nova-log', 'aria-live': 'polite' });
  const chipsEl = h('div', { class: 'nova-chips' });
  const input = h('textarea', { rows: '1', placeholder: 'שאל את {{ASSISTANT}} משהו…', 'aria-label': 'הודעה ל-{{ASSISTANT}}', maxlength: '2000' });
  const sendBtn = h('button', { class: 'nova-send', type: 'submit', 'aria-label': 'שלח' }, '↑');
  const form = h('form', { class: 'nova-form' }, input, sendBtn);
  const closeNova = h('button', { class: 'x', type: 'button', 'aria-label': 'סגור' }, '✕');
  nova.append(
    h('div', { class: 'nova-head' }, h('div', { class: 'nova-ava' }, h('img', { src: 'assets/orb.webp', alt: '' })),
      h('div', null, h('div', { class: 'nova-name' }, '{{ASSISTANT}}'), h('div', { class: 'nova-sub' }, h('i', { class: 'pulse' }), 'העוזרת האישית שלך · מחוברת')), closeNova),
    logEl, chipsEl, form, h('div', { class: 'nova-note' }, '{{ASSISTANT}} רואה את הנתונים ועוזרת לנסח. שליחה ואישור נשארים בטלגרם.'));

  function paintChat() {
    const greeting = h('div', { class: 'msg bot' }, 'היי, אני {{ASSISTANT}}. אני מכירה את כל מה שקורה בחשבון: מי מחכה לתשובה, איך היה היום, מה מתוזמן ואיך הקמפיינים. מה תרצה לדעת?');
    logEl.replaceChildren(greeting, ...chat.map((m) => h('div', { class: 'msg ' + (m.role === 'user' ? 'me' : m.error ? 'err' : 'bot') }, m.text)));
    if (busy) logEl.append(h('div', { class: 'typing' }, h('i'), h('i'), h('i')));
    chipsEl.replaceChildren(...(chat.length ? [] : SUGGEST.map((s) => { const b = h('button', { type: 'button' }, s); b.addEventListener('click', () => sendNova(s)); return b; })));
    logEl.scrollTop = logEl.scrollHeight;
    sendBtn.disabled = busy;
  }

  async function sendNova(text) {
    text = String(text || '').trim();
    if (!text || busy) return;
    chat.push({ role: 'user', text });
    busy = true; input.value = ''; input.style.height = ''; paintChat();
    try {
      const res = await fetch('assistant', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: chat.filter((m) => !m.error).map(({ role, text }) => ({ role, text })) }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'שגיאה');
      chat.push({ role: 'assistant', text: body.reply });
    } catch (e) {
      chat.push({ role: 'assistant', text: e.message || '{{ASSISTANT}} לא זמינה כרגע.', error: true });
    }
    busy = false;
    chat = chat.slice(-40);
    try { sessionStorage.setItem(KEY, JSON.stringify(chat)); } catch { /* private mode */ }
    paintChat();
    input.focus();
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); sendNova(input.value); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNova(input.value); } });
  input.addEventListener('input', () => { input.style.height = ''; input.style.height = Math.min(110, input.scrollHeight) + 'px'; });
  const toggleNova = (open) => { nova.classList.toggle('open', open); fab.classList.toggle('open', open); if (open) { paintChat(); input.focus(); } };
  fab.addEventListener('click', () => toggleNova(!nova.classList.contains('open')));
  closeNova.addEventListener('click', () => toggleNova(false));
  document.addEventListener('keydown', (e) => e.key === 'Escape' && toggleNova(false));

  // ---------- shell ----------
  function banner(d) {
    const el = document.getElementById('banner');
    let msg = null, cls = '';
    if (!d.account.connected) msg = 'אינסטגרם לא מחובר. צריך להתחבר מחדש דרך ‎/auth/login';
    else if (d.account.paused) { msg = 'הסוכן מושהה: לא נוצרות טיוטות ולא נשלח דבר. ‎/resume בטלגרם כדי להמשיך.'; cls = ' warn'; }
    else if (d.health.poll_age_min != null && d.health.poll_age_min > 20) { msg = `הסנכרון מול אינסטגרם לא הצליח כבר ${d.health.poll_age_min} דקות.`; cls = ' warn'; }
    else if (d.health.token_days != null && d.health.token_days <= 5) { msg = `הטוקן פג בעוד ${d.health.token_days} ימים.`; cls = ' warn'; }
    el.className = 'banner' + (msg ? ' show' + cls : '');
    el.textContent = msg || '';
  }

  function render(d, force) {
    state.data = d;
    banner(d);
    if (!['overview', 'leads', 'content'].includes(state.tab)) state.tab = 'overview';
    // Don't rebuild the page under someone who is typing in the search box.
    const typing = document.activeElement?.classList?.contains('search');
    if (state.tab === 'leads' && typing && !force) document.getElementById('board')?.replaceWith(board());
    else {
      const body = state.tab === 'leads' ? leadsView(d)
        : state.tab === 'content' ? h('div', { class: 'cols' }, h('div', { class: 'stack' }, campaigns(d), scheduled(d)), h('div', { class: 'stack' }, insights(d), posts(d)))
        : h('div', null, quests(d), tiles(d), h('div', { class: 'cols' }, h('div', { class: 'stack' }, pending(d), chart(d)), h('div', { class: 'stack' }, threads(d), health(d))));
      document.getElementById('app').replaceChildren(hero(d), tabs(d), body);
    }
    document.getElementById('foot').textContent = `עודכן ${d.generated_at} · מתרענן כל 30 שניות · תצוגה בלבד`;
    if (state.open) openLead(state.open, true);
  }

  async function load() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      render(await res.json());
    } catch (e) {
      const el = document.getElementById('banner');
      el.className = 'banner show';
      el.textContent = 'לא הצלחתי לטעון נתונים מהשרת. מנסה שוב…';
    }
  }
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
