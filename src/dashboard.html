<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>IG Agent</title>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --line: #e9e8e6; --hover: #f3f2f0;
    --text: #141413; --muted: #6f6e6a; --dim: #a8a7a2;
    --alert: #d4351c; --ok: #177a55; --warn: #a15c07;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #191918; --line: #2a2a28; --hover: #20201f;
      --text: #f1f0ee; --muted: #a09f9a; --dim: #6b6a66;
      --alert: #f0705a; --ok: #4cc497; --warn: #e0a64a;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 36px 20px 72px; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .empty { color: var(--dim); padding: 20px 0; font-size: 14px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }

  /* header */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .name { font-size: 26px; font-weight: 650; letter-spacing: -.01em; direction: ltr; unicode-bidi: isolate; line-height: 1.2; }
  .status { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .status span { display: inline-flex; align-items: center; gap: 6px; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .led.bad { background: var(--alert); } .led.warn { background: var(--warn); }
  .progress { min-width: 220px; font-size: 13px; color: var(--muted); }
  .progress b { color: var(--text); font-weight: 600; }
  .track { height: 2px; background: var(--line); margin-top: 8px; }
  .track i { display: block; height: 100%; background: var(--text); transition: width .5s ease; }

  /* tabs */
  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 30px 0 28px; }
  .tab { background: none; border: 0; padding: 0 0 12px; margin-bottom: -1px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; display: inline-flex; gap: 7px; align-items: baseline; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .tab .badge { font-size: 12px; color: var(--alert); font-weight: 600; }

  /* sections */
  section { margin-bottom: 40px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; }
  h2 .count { color: var(--dim); font-weight: 500; }
  h2 .side { margin-inline-start: auto; font-weight: 400; font-size: 12px; color: var(--dim); display: flex; gap: 14px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; align-items: start; }

  /* numbers row */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); border-block: 1px solid var(--line); margin-bottom: 40px; }
  .kpi { padding: 18px 16px 16px; border-inline-start: 1px solid var(--line); min-width: 0; }
  .kpi:first-child { border-inline-start: 0; padding-inline-start: 0; }
  .kpi .value { font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; text-align: right; }
  .kpi .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .kpi .delta { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .up { color: var(--ok); } .down { color: var(--alert); }

  /* today checklist */
  .missions { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 28px; font-size: 14px; }
  .mission { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); }
  .mission .box { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dim); display: grid; place-items: center; font-size: 10px; flex: none; }
  .mission.done { color: var(--text); }
  .mission.done .box { background: var(--text); border-color: var(--text); color: var(--bg); }
  .mission small { color: var(--dim); font-size: 13px; }

  /* lists */
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
  .left { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .handle { font-weight: 600; direction: ltr; unicode-bidi: isolate; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote { color: var(--muted); font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
  .draft { margin-top: 8px; padding-inline-start: 12px; border-inline-start: 2px solid var(--text); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tag::before { content: "#"; color: var(--dim); }
  .kind { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .meta { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .timer { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .timer.low { color: var(--alert); }
  .wait { width: 6px; height: 6px; border-radius: 50%; background: var(--alert); flex: none; align-self: center; }
  .stage { font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .stage i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: start; font-size: 12px; color: var(--dim); font-weight: 500; padding: 10px 0; border-bottom: 1px solid var(--line); }
  td { padding: 13px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n, th.n { text-align: left; }
  .kv { display: grid; grid-template-columns: 1fr auto; margin: 0; font-size: 14px; }
  .kv dt, .kv dd { padding: 11px 0; border-bottom: 1px solid var(--line); margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { text-align: left; font-weight: 500; }

  /* chart */
  .chart { display: grid; grid-template-columns: repeat(14, 1fr); gap: 10px; align-items: end; height: 120px; direction: ltr; margin-top: 18px; }
  .chart .day { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 8px; min-width: 0; }
  .chart .bars { display: flex; gap: 2px; align-items: flex-end; height: 100%; }
  .chart .bars i { flex: 1; min-height: 1px; }
  .chart .in { background: var(--dim); } .chart .out { background: var(--text); }
  .chart .d { font-size: 10px; color: var(--dim); text-align: center; }
  .chart .day.today .d { color: var(--text); font-weight: 600; }
  .key i { display: inline-block; width: 8px; height: 8px; margin-inline-end: 5px; }

  /* CRM */
  .funnel { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line); margin-bottom: 24px; }
  .toolbar { display: flex; gap: 20px; margin-bottom: 26px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1; min-width: 200px; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 9px 0; color: var(--text); font: inherit; border-radius: 0; }
  .search:focus { outline: none; border-bottom-color: var(--text); }
  .search::placeholder { color: var(--dim); }
  .check { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
  .check .box { width: 15px; height: 15px; border: 1.5px solid var(--dim); border-radius: 4px; display: grid; place-items: center; font-size: 10px; }
  .check.on { color: var(--text); } .check.on .box { background: var(--text); border-color: var(--text); color: var(--bg); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .board.with-spam { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
  .col-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .col-head i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .col-head .count { margin-inline-start: auto; color: var(--dim); font-weight: 500; }
  .lead { display: block; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 13px; margin-bottom: 8px; cursor: pointer; transition: border-color .12s ease; }
  .lead:hover { border-color: var(--dim); }
  .lead .snippet { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .lead .foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; align-items: baseline; }
  .lead .foot .meta { margin-inline-start: auto; }
  .more { color: var(--dim); font-size: 12px; padding: 6px 0; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 28px; }

  /* drawer */
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .28); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; inset: 0 auto 0 0; width: min(440px, 100vw); background: var(--surface); border-right: 1px solid var(--line); z-index: 21; transform: translateX(-105%); transition: transform .22s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .d-head { padding: 24px 24px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .d-head .x { margin-inline-start: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; flex: none; }
  .d-facts { display: flex; gap: 22px; padding: 0 24px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .d-facts b { color: var(--text); font-weight: 600; }
  .d-notes { margin: 16px 24px; padding-inline-start: 12px; border-inline-start: 2px solid var(--warn); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .d-notes b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .d-notes + .chat { border-top: 1px solid var(--line); }
  .chat { flex: 1; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble.them { align-self: flex-start; background: var(--hover); }
  .bubble.me { align-self: flex-end; background: var(--text); color: var(--bg); }
  .bubble.pending { align-self: flex-end; border: 1px dashed var(--dim); color: var(--muted); }
  .bubble small { display: block; font-size: 10px; opacity: .6; margin-top: 2px; direction: ltr; text-align: end; }
  .daysep { align-self: center; font-size: 11px; color: var(--dim); margin: 10px 0 4px; }
  .d-foot { padding: 14px 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }

  .banner { margin-bottom: 24px; padding: 12px 14px; border-radius: var(--radius); font-size: 14px; display: none; border: 1px solid var(--line); background: var(--surface); }
  .banner.show { display: block; }
  .banner.bad { border-color: var(--alert); color: var(--alert); } .banner.warn { border-color: var(--warn); color: var(--warn); }
  footer { margin-top: 28px; font-size: 12px; color: var(--dim); }
  a { color: inherit; }

  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; gap: 0; }
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .kpi:nth-child(4) { border-inline-start: 0; padding-inline-start: 0; }
    .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
    .board, .board.with-spam { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 76vw; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding-bottom: 8px; }
    .col { scroll-snap-align: start; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 24px 16px 56px; }
    .name { font-size: 22px; } .progress { min-width: 0; width: 100%; }
    .tabs { gap: 20px; margin: 22px 0; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi { border-inline-start: 0 !important; padding-inline-start: 0 !important; border-top: 1px solid var(--line); }
    .kpi:nth-child(-n+2) { border-top: 0; }
    .kpi .value { font-size: 26px; }
    .funnel { grid-template-columns: repeat(2, 1fr); }
    .missions { gap: 12px; flex-direction: column; }
    .chart { gap: 4px; } .chart .day:nth-child(even):not(.today) .d { visibility: hidden; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner" class="banner"></div>
  <div id="app"><div class="empty">טוען…</div></div>
  <footer id="foot"></footer>
</div>
<div id="backdrop" class="backdrop"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="פרטי ליד"></aside>
<script>
(() => {
  // Everything is rendered with textContent, so message text can never inject HTML.
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const n = (v) => (v == null ? '—' : Number(v).toLocaleString('en-US'));
  const dur = (ms) => {
    if (ms == null) return null;
    const hrs = Math.floor(ms / 3600000), min = Math.floor((ms % 3600000) / 60000);
    return hrs ? `${hrs} שע׳` : `${min} דק׳`;
  };
  const timer = (ms) => h('span', { class: 'timer' + (ms < 3 * 3600000 ? ' low' : '') }, 'נותרו ' + dur(ms));
  const TYPE = { image: 'פוסט', story: 'סטורי', reel: 'ריל', carousel: 'קרוסלה' };
  const CAMPAIGN = { active: ['פעיל', 'ok'], paused: ['מושהה', 'warn'], draft: ['ממתין לאישור', ''] };
  const STAGES = [['new', 'חדש', 'var(--dim)'], ['interested', 'מתעניין', 'var(--warn)'], ['customer', 'לקוח', 'var(--ok)'], ['vip', 'VIP', 'var(--text)'], ['spam', 'ספאם', 'var(--line)']];
  const stageOf = (k) => STAGES.find(([key]) => key === k) || STAGES[0];
  const stageTag = (k) => { const s = stageOf(k); return h('span', { class: 'stage', style: `--c:${s[2]}` }, h('i'), s[1]); };
  const state = { tab: location.hash.slice(1) || 'overview', q: '', waiting: false, spam: false, open: null, data: null };

  const section = (title, count, ...body) => h('section', null, h('h2', null, title, count != null ? h('span', { class: 'count num' }, count) : null), ...body);

  // ---------- header ----------
  function head(d) {
    const g = d.game, a = d.account;
    const pct = Math.min(1, (g.xp - g.level_floor) / Math.max(1, g.level_next - g.level_floor));
    return h('div', { class: 'head' },
      h('div', null,
        h('div', { class: 'name' }, a.username ? '@' + a.username : 'IG Agent'),
        h('div', { class: 'status' },
          h('span', null, h('i', { class: 'led' + (a.connected ? '' : ' bad') }), a.connected ? 'מחובר' : 'לא מחובר'),
          h('span', null, h('i', { class: 'led' + (a.paused ? ' warn' : '') }), a.paused ? 'מושהה' : 'פעיל'),
          a.followers != null && h('span', null, h('span', { class: 'num' }, n(a.followers)), 'עוקבים'),
          (d.health.auto_send_dm || d.health.auto_send_comments) && h('span', { style: 'color:var(--warn)' }, 'שליחה אוטומטית דולקת'))),
      h('div', { class: 'progress' },
        h('div', null, 'רמה ', h('b', { class: 'num' }, g.level), ' · ', h('b', { class: 'num' }, g.streak), g.streak === 1 ? ' יום ברצף' : ' ימים ברצף', ' · ', h('span', { class: 'num' }, `${n(g.xp)}/${n(g.level_next)}`)),
        h('div', { class: 'track' }, h('i', { style: `width:${Math.round(pct * 100)}%` }))));
  }

  function tabs(d) {
    const waiting = d.leads.filter((l) => l.waiting && l.stage !== 'spam').length;
    const defs = [['overview', 'סקירה', d.pending.length], ['leads', 'לידים', waiting], ['content', 'תוכן וקמפיינים', 0]];
    return h('div', { class: 'tabs', role: 'tablist' }, defs.map(([key, label, badge]) => {
      const b = h('button', { class: 'tab' + (state.tab === key ? ' on' : ''), role: 'tab', type: 'button', 'aria-selected': String(state.tab === key) }, label, badge ? h('span', { class: 'badge num' }, badge) : null);
      b.addEventListener('click', () => { state.tab = key; history.replaceState(null, '', '#' + key); render(state.data, true); });
      return b;
    }));
  }

  // ---------- overview ----------
  const missions = (d) => h('div', { class: 'missions' }, d.game.missions.map((m) =>
    h('span', { class: 'mission' + (m.done ? ' done' : '') }, h('span', { class: 'box' }, m.done ? '✓' : ''), m.title, h('small', null, m.detail))));

  function kpi(label, value, prev) {
    let delta = null;
    if (prev != null && value != null) {
      const diff = value - prev;
      delta = h('div', { class: 'delta' }, diff ? h('span', { class: 'num ' + (diff > 0 ? 'up' : 'down') }, (diff > 0 ? '+' : '−') + n(Math.abs(diff))) : 'ללא שינוי', diff ? ' מאתמול' : '');
    }
    return h('div', { class: 'kpi' }, h('div', { class: 'value num' }, n(value)), h('div', { class: 'label' }, label), delta);
  }
  const kpis = (d) => h('div', { class: 'kpis' },
    kpi('הודעות נכנסו', d.today.messages_in, d.yesterday.messages_in),
    kpi('תשובות יצאו', d.today.replies_sent, d.yesterday.replies_sent),
    kpi('תגובות חדשות', d.today.comments_in, d.yesterday.comments_in),
    kpi('פורסמו', d.today.published, d.yesterday.published),
    kpi('הודעות קמפיין', d.today.campaign_dms, d.yesterday.campaign_dms),
    kpi('קליקים', d.today.campaign_clicks, d.yesterday.campaign_clicks));

  function pending(d) {
    const items = d.pending.map((p) => h('div', { class: 'item' },
      h('div', { class: 'row' },
        h('div', { class: 'left' }, h('span', { class: 'handle' }, '@' + p.who), h('span', { class: 'kind' }, p.kind === 'dm' ? 'הודעה' : 'תגובה')),
        p.window_ms != null ? timer(p.window_ms) : h('span', { class: 'meta num' }, p.created.slice(5))),
      h('div', { class: 'quote' }, p.incoming || ''),
      h('div', { class: 'draft' }, p.draft)));
    return section('מחכה לאישור שלך בטלגרם', d.pending.length, items.length ? items : h('div', { class: 'empty' }, 'אין טיוטות שמחכות.'));
  }

  function chart(d) {
    const max = Math.max(1, ...d.series.map((s) => Math.max(s.messages_in, s.replies_sent)));
    const days = d.series.map((s, i) => h('div', { class: 'day' + (i === d.series.length - 1 ? ' today' : ''), title: `${s.day}: ${s.messages_in} נכנסו, ${s.replies_sent} יצאו` },
      h('div', { class: 'bars' }, h('i', { class: 'in', style: `height:${(s.messages_in / max) * 100}%` }), h('i', { class: 'out', style: `height:${(s.replies_sent / max) * 100}%` })),
      h('div', { class: 'd' }, s.day.slice(8))));
    return h('section', null,
      h('h2', null, '14 ימים אחרונים', h('span', { class: 'side' }, h('span', { class: 'key' }, h('i', { style: 'background:var(--dim)' }), 'נכנסו'), h('span', { class: 'key' }, h('i', { style: 'background:var(--text)' }), 'יצאו'))),
      h('div', { class: 'chart' }, days));
  }

  function threads(d) {
    const items = d.threads.slice(0, 7).map((t) => h('div', { class: 'item' },
      h('div', { class: 'row' },
        h('div', { class: 'left' }, t.waiting && h('i', { class: 'wait', title: 'מחכה לתשובה' }), h('span', { class: 'handle' }, '@' + t.who), t.stage !== 'new' && stageTag(t.stage)),
        h('span', { class: 'meta num' }, (t.at || '').slice(5))),
      h('div', { class: 'quote' }, (t.from_me ? 'אתה: ' : '') + (t.last || ''))));
    return section('שיחות אחרונות', null, items.length ? items : h('div', { class: 'empty' }, 'עוד אין שיחות.'));
  }

  function health(d) {
    const x = d.health;
    return section('מצב המערכת', null, h('dl', { class: 'kv' },
      h('dt', null, 'תוקף הטוקן'), h('dd', { class: x.token_days != null && x.token_days <= 5 ? 'down' : '' }, x.token_days == null ? '—' : h('span', null, h('span', { class: 'num' }, x.token_days), ' ימים')),
      h('dt', null, 'סנכרון אחרון'), h('dd', { class: 'num' }, (x.last_poll || '—').slice(5)),
      h('dt', null, 'Webhook אחרון'), h('dd', { class: 'num' }, (x.last_webhook || '—').slice(5)),
      h('dt', null, 'סך תשובות'), h('dd', { class: 'num' }, n(d.game.totals.replies)),
      h('dt', null, 'סך פרסומים'), h('dd', { class: 'num' }, n(d.game.totals.posts))));
  }

  // ---------- content ----------
  function campaigns(d) {
    if (!d.campaigns.length) return section('קמפיינים', null, h('div', { class: 'empty' }, 'אין קמפיינים. יוצרים דרך Claude ומאשרים בטלגרם.'));
    const rows = d.campaigns.map((c) => {
      const [label, cls] = CAMPAIGN[c.status] || [c.status, ''];
      return h('tr', null,
        h('td', null, h('div', { style: 'font-weight:600' }, c.name), h('div', { class: 'meta', style: 'white-space:normal' }, c.keywords.join(', '))),
        h('td', null, h('span', { class: 'stage', style: `--c:var(--${cls || 'dim'})` }, h('i'), label)),
        h('td', { class: 'n num' }, n(c.sent)), h('td', { class: 'n num' }, n(c.clicked)), h('td', { class: 'n num' }, c.ctr == null ? '—' : c.ctr + '%'));
    });
    return section('קמפיינים', d.campaigns.length,
      h('table', null, h('thead', null, h('tr', null, h('th', null, 'שם'), h('th', null, 'מצב'), h('th', { class: 'n' }, 'נשלחו'), h('th', { class: 'n' }, 'הקליקו'), h('th', { class: 'n' }, 'CTR'))), h('tbody', null, rows)));
  }

  function insights(d) {
    const i = d.insights;
    if (!i) return section('ביצועי החשבון, 24 שעות', null, h('div', { class: 'empty' }, 'אין עדיין נתונים מאינסטגרם.'));
    const f = d.account;
    const rows = [['חשיפה', i.reach], ['צפיות', i.views], ['חשבונות שהגיבו', i.accounts_engaged], ['אינטראקציות', i.total_interactions], ['לייקים', i.likes], ['שמירות', i.saves], ['שיתופים', i.shares]].filter(([, v]) => v != null);
    return section('ביצועי החשבון, 24 שעות', null, h('dl', { class: 'kv' },
      h('dt', null, 'עוקבים'), h('dd', null, f.followers_delta ? h('span', { class: 'num ' + (f.followers_delta > 0 ? 'up' : 'down'), style: 'font-weight:400;font-size:13px;margin-inline-end:8px' }, (f.followers_delta > 0 ? '+' : '') + f.followers_delta) : null, ' ', h('span', { class: 'num' }, n(f.followers))),
      rows.map(([k, v]) => [h('dt', null, k), h('dd', { class: 'num' }, n(v))])));
  }

  function scheduled(d) {
    const items = d.scheduled.map((p) => h('div', { class: 'item' },
      h('div', { class: 'row' }, h('div', { class: 'left' }, h('span', { class: 'num', style: 'font-weight:600' }, p.run_at.slice(5)), h('span', { class: 'kind' }, TYPE[p.type] || p.type)), p.attempts ? h('span', { class: 'timer low' }, 'ניסיון ' + (p.attempts + 1)) : null),
      p.caption && h('div', { class: 'quote' }, p.caption.slice(0, 110))));
    return section('פוסטים מתוזמנים', d.scheduled.length, items.length ? items : h('div', { class: 'empty' }, 'אין פוסטים בתור.'),
      d.unpublished_media ? h('div', { class: 'meta', style: 'margin-top:12px;white-space:normal' }, `${d.unpublished_media} קבצים הועלו ועדיין לא פורסמו`) : null);
  }

  function posts(d) {
    if (!d.posts.length) return null;
    return section('פוסטים אחרונים', null, d.posts.map((p) => h('div', { class: 'item' },
      h('div', { class: 'row' }, h('span', { style: 'overflow-wrap:anywhere' }, p.caption || '(ללא כיתוב)'), h('span', { class: 'meta num' }, n(p.comments) + ' תגובות')),
      h('div', { class: 'meta num' }, (p.at || '').slice(5)))));
  }

  // ---------- leads ----------
  function leadCard(l) {
    const el = h('button', { class: 'lead', type: 'button' },
      h('div', { class: 'row' }, h('div', { class: 'left', style: 'flex-wrap:nowrap' }, l.waiting && h('i', { class: 'wait', title: 'מחכה לתשובה' }), h('span', { class: 'handle' }, '@' + l.who)), h('span', { class: 'meta num' }, (l.at || '').slice(5, 10))),
      h('div', { class: 'snippet' }, (l.from_me ? 'אתה: ' : '') + (l.last || '')),
      (l.waiting || l.tags.length || l.notes) && h('div', { class: 'foot' }, l.waiting && timer(l.window_ms), l.tags.slice(0, 3).map((t) => h('span', { class: 'tag' }, t)), l.notes && h('span', { class: 'meta', title: l.notes }, 'הערה')));
    el.addEventListener('click', () => openLead(l.id));
    return el;
  }

  function board() {
    const d = state.data, q = state.q.trim().toLowerCase();
    const list = d.leads.filter((l) => (!state.waiting || l.waiting) && (!q || [l.who, l.name, l.last, l.notes, ...l.tags].some((x) => x && String(x).toLowerCase().includes(q))));
    const cols = STAGES.filter(([k]) => k !== 'spam' || state.spam).map(([key, label, color]) => {
      const items = list.filter((l) => l.stage === key).sort((a, b) => Number(b.waiting) - Number(a.waiting));
      return h('div', { class: 'col' },
        h('div', { class: 'col-head', style: `--c:${color}` }, h('i'), label, h('span', { class: 'count num' }, items.length)),
        items.slice(0, 40).map(leadCard), items.length > 40 && h('div', { class: 'more' }, `ועוד ${items.length - 40}`));
    });
    return h('div', { class: 'board' + (state.spam ? ' with-spam' : ''), id: 'board' }, cols);
  }

  function funnel(d) {
    const real = d.leads.filter((l) => l.stage !== 'spam');
    const by = (k) => real.filter((l) => l.stage === k).length;
    const total = real.length, engaged = by('interested') + by('customer') + by('vip'), customers = by('customer') + by('vip');
    const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
    const step = (label, value, sub) => h('div', { class: 'kpi' }, h('div', { class: 'value num' }, n(value)), h('div', { class: 'label' }, label), h('div', { class: 'delta' }, sub));
    return h('div', { class: 'funnel' },
      step('לידים', total, 'כל מי שכתב לך'),
      step('מתעניינים ומעלה', engaged, pct(engaged, total) + ' מהלידים'),
      step('לקוחות', customers, pct(customers, engaged) + ' מהמתעניינים'),
      step('מחכים לתשובה', real.filter((l) => l.waiting).length, 'בחלון 24 השעות'));
  }

  function leadsView(d) {
    const search = h('input', { class: 'search', type: 'search', placeholder: 'חיפוש: שם, תגית, הערה או טקסט', 'aria-label': 'חיפוש לידים' });
    search.value = state.q;
    const refresh = () => document.getElementById('board')?.replaceWith(board());
    search.addEventListener('input', () => { state.q = search.value; refresh(); });
    const toggle = (label, key) => {
      const box = h('span', { class: 'box' }, state[key] ? '✓' : '');
      const b = h('button', { class: 'check' + (state[key] ? ' on' : ''), type: 'button', role: 'checkbox', 'aria-checked': String(state[key]) }, box, label);
      b.addEventListener('click', () => { state[key] = !state[key]; b.classList.toggle('on', state[key]); b.setAttribute('aria-checked', String(state[key])); box.textContent = state[key] ? '✓' : ''; refresh(); });
      return b;
    };
    return h('div', null, funnel(d), h('div', { class: 'toolbar' }, search, toggle('רק מחכים לתשובה', 'waiting'), toggle('הצג ספאם', 'spam')),
      d.leads.length ? board() : h('div', { class: 'empty' }, 'עוד אין שיחות. מי שיכתוב לך יופיע כאן.'),
      h('div', { class: 'hint' }, 'לשינוי שלב, תגיות או הערות מבקשים מ-Claude, למשל: "סמן את dana כלקוחה והוסף הערה".'));
  }

  // ---------- lead drawer ----------
  const drawer = document.getElementById('drawer'), backdrop = document.getElementById('backdrop');
  function closeLead() { state.open = null; drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  backdrop.addEventListener('click', closeLead);
  document.addEventListener('keydown', (e) => e.key === 'Escape' && closeLead());
  function closeBtn() { const b = h('button', { class: 'x', type: 'button', 'aria-label': 'סגור' }, '✕'); b.addEventListener('click', closeLead); return b; }

  async function openLead(id, silent) {
    state.open = id;
    const lead = state.data.leads.find((l) => l.id === id);
    if (!silent) {
      drawer.replaceChildren(h('div', { class: 'd-head' }, h('div', { class: 'name', style: 'font-size:20px' }, '@' + (lead?.who || '')), closeBtn()), h('div', { class: 'empty', style: 'padding:0 24px' }, 'טוען שיחה…'));
      drawer.classList.add('open'); backdrop.classList.add('open');
    }
    let t;
    try {
      t = await (await fetch(`thread/${encodeURIComponent(id)}.json`, { cache: 'no-store' })).json();
    } catch { return; }
    if (state.open !== id || !t) return;
    const chat = h('div', { class: 'chat' });
    let day = '';
    for (const m of t.messages) {
      if (m.at.slice(0, 10) !== day) { day = m.at.slice(0, 10); chat.append(h('div', { class: 'daysep num' }, day)); }
      chat.append(h('div', { class: 'bubble ' + (m.me ? 'me' : 'them') }, m.text, h('small', null, m.at.slice(11) + (m.ai ? ' · AI' : ''))));
    }
    for (const dr of t.drafts) chat.append(h('div', { class: 'bubble pending' }, dr.text, h('small', null, `טיוטה #${dr.id} · מחכה לאישור`)));
    const keepScroll = silent ? drawer.querySelector('.chat')?.scrollTop : null;
    drawer.replaceChildren(
      h('div', { class: 'd-head' },
        h('div', { style: 'min-width:0' }, h('div', { class: 'name', style: 'font-size:20px' }, '@' + t.who),
          h('div', { class: 'left', style: 'margin-top:6px;gap:12px' }, stageTag(t.stage), t.tags.map((x) => h('span', { class: 'tag' }, x)))), closeBtn()),
      h('div', { class: 'd-facts' },
        h('span', null, h('b', { class: 'num' }, n(lead?.msgs_in)), ' הודעות ממנו'),
        h('span', null, h('b', { class: 'num' }, n(lead?.msgs_out)), ' תשובות שלך'),
        h('span', null, 'חלון מענה: ', h('b', null, t.window_ms > 0 ? dur(t.window_ms) : 'סגור'))),
      t.notes && h('div', { class: 'd-notes' }, h('b', null, 'ההערות שלך'), t.notes),
      chat,
      h('div', { class: 'd-foot' }, (lead?.first_at ? `בקשר מאז ${lead.first_at} · ` : '') + 'תצוגה בלבד. עונים דרך טלגרם או Claude.'));
    const box = drawer.querySelector('.chat');
    box.scrollTop = keepScroll ?? box.scrollHeight;
  }

  // ---------- shell ----------
  function banner(d) {
    const el = document.getElementById('banner');
    let msg = null, cls = 'bad';
    if (!d.account.connected) msg = 'אינסטגרם לא מחובר. צריך להתחבר מחדש דרך ‎/auth/login';
    else if (d.account.paused) { msg = 'הסוכן מושהה: לא נוצרות טיוטות ולא נשלח דבר. ‎/resume בטלגרם כדי להמשיך.'; cls = 'warn'; }
    else if (d.health.poll_age_min != null && d.health.poll_age_min > 20) { msg = `הסנכרון מול אינסטגרם לא הצליח כבר ${d.health.poll_age_min} דקות.`; cls = 'warn'; }
    else if (d.health.token_days != null && d.health.token_days <= 5) { msg = `הטוקן פג בעוד ${d.health.token_days} ימים.`; cls = 'warn'; }
    el.className = 'banner' + (msg ? ' show ' + cls : '');
    el.textContent = msg || '';
  }

  function render(d, force) {
    state.data = d;
    banner(d);
    if (!['overview', 'leads', 'content'].includes(state.tab)) state.tab = 'overview';
    // Don't rebuild the page under someone who is typing in the search box.
    const typing = document.activeElement?.classList?.contains('search');
    if (state.tab === 'leads' && typing && !force) document.getElementById('board')?.replaceWith(board());
    else {
      const body = state.tab === 'leads' ? leadsView(d)
        : state.tab === 'content' ? h('div', { class: 'cols' }, h('div', null, campaigns(d), insights(d)), h('div', null, scheduled(d), posts(d)))
        : h('div', null, missions(d), kpis(d), h('div', { class: 'cols' }, h('div', null, pending(d), chart(d)), h('div', null, threads(d), health(d))));
      document.getElementById('app').replaceChildren(head(d), tabs(d), body);
    }
    document.getElementById('foot').textContent = `עודכן ${d.generated_at} · מתרענן כל 30 שניות · תצוגה בלבד`;
    if (state.open) openLead(state.open, true);
  }

  async function load() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      render(await res.json());
    } catch (e) {
      const el = document.getElementById('banner');
      el.className = 'banner show bad';
      el.textContent = 'לא הצלחתי לטעון נתונים מהשרת. מנסה שוב…';
    }
  }
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
