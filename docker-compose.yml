services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      - ./data:/app/data
      # Edit style.md on the host; it is re-read on every draft (no restart needed).
      - ./style.md:/app/style.md:ro
    expose:
      - "3000"
    stop_grace_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - agent
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
